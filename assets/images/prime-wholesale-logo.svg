<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 52" width="260" height="52">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4A359" />
      <stop offset="50%" stop-color="#F3E5AB" />
      <stop offset="100%" stop-color="#C58B2B" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B1825" />
      <stop offset="100%" stop-color="#540A12" />
    </linearGradient>
  </defs>

  <!-- Crest Shield (x: 4–50, y: 2–48) -->
  <g transform="translate(4, 2)">
    <path d="M 24 1 L 43 8 L 43 28 C 43 40 24 46 24 46 C 24 46 5 40 5 28 L 5 8 Z"
          fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="1.8"/>
    <path d="M 15 15 L 33 31" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 33 15 L 15 31" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <polygon points="24,18 25.4,21.4 29,21.8 26.6,24.2 27.2,27.8 24,26.2 20.8,27.8 21.4,24.2 19,21.8 22.6,21.4"
             fill="url(#goldGrad)"/>
  </g>

  <!-- "PRIME" — uses currentColor so it works in both light & dark mode -->
  <text x="58" y="28"
        font-family="'Fraunces','Georgia',serif"
        font-weight="900"
        font-size="22"
        letter-spacing="3"
        fill="currentColor">PRIME</text>

  <!-- "WHOLESALE" pill badge -->
  <rect x="137" y="12" width="80" height="16" rx="4"
        fill="url(#redGrad)" stroke="url(#goldGrad)" stroke-width="1"/>
  <text x="177" y="23.5"
        font-family="'Plus Jakarta Sans','Arial',sans-serif"
        font-weight="800"
        font-size="8"
        letter-spacing="1.6"
        fill="#FFFFFF"
        text-anchor="middle">WHOLESALE</text>

  <!-- Divider line between PRIME row and subtitle -->
  <line x1="58" y1="33" x2="224" y2="33" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.6"/>

  <!-- "MEATS &amp; PROVISIONS" subtitle -->
  <text x="58" y="44"
        font-family="'Plus Jakarta Sans','Arial',sans-serif"
        font-weight="700"
        font-size="9"
        letter-spacing="2.5"
        fill="url(#goldGrad)">MEATS &amp; PROVISIONS</text>
</svg>
